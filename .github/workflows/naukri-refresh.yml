name: Naukri profile refresh

# Fixed slots (IST): 08:00, 09:18, 14:00 — no intentional jitter.
# Cron times are UTC (= IST − 5:30). Note: GitHub may still queue a scheduled
# run a few minutes late under load; we no longer add our own random delay.
on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST
    - cron: "48 3 * * *"   # 09:18 IST
    - cron: "30 8 * * *"   # 14:00 IST
  workflow_dispatch:

concurrency:
  group: naukri-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Decrypt session and resumes
        env:
          CI_SECRETS_PASSPHRASE: ${{ secrets.CI_SECRETS_PASSPHRASE }}
        run: node ci/crypto.js decrypt

      - name: Refresh profile
        env:
          NAUKRI_STORAGE_STATE: ci-secrets/naukri-session.json
          RESUME_A_PATH: ci-secrets/resume-a.pdf
          RESUME_B_PATH: ci-secrets/resume-b.pdf
        run: |
          export RESUME_LABEL=$([ $(( GITHUB_RUN_NUMBER % 2 )) -eq 0 ] && echo A || echo B)
          xvfb-run -a node naukri-profile-refresh.js

      - name: Run summary
        if: always()
        run: |
          {
            echo "### Naukri refresh — ${{ job.status }} — $(TZ=Asia/Kolkata date '+%d %b %Y, %H:%M IST')"
            echo '```'
            cat naukri-refresh.log 2>/dev/null || echo "no log — failed before the refresh script ran (see step logs)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Screenshots show the profile page, and artifacts on a public repo are downloadable by anyone,
      # so they are encrypted with the same passphrase before upload.
      - name: Encrypt failure screenshots
        if: failure()
        env:
          CI_SECRETS_PASSPHRASE: ${{ secrets.CI_SECRETS_PASSPHRASE }}
        run: node ci/crypto.js encrypt naukri-refresh-error-*.png

      - name: Upload log and encrypted screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-refresh-debug
          path: |
            naukri-refresh.log
            naukri-refresh-error-*.png.enc
          if-no-files-found: ignore
          retention-days: 7
