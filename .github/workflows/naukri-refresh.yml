name: Naukri profile refresh

# Slots (IST): 08:00, 09:18, 14:00 — each run lands at a random time within ±15 min of its slot.
# Crons fire 15 min before each slot (UTC = IST − 5:30); the jitter step then waits until slot + random offset,
# measured from the real start time so GitHub's queue delay doesn't push it outside the window.
on:
  schedule:
    - cron: "15 2 * * *"   # 08:00 IST slot → window 07:45–08:15
    - cron: "33 3 * * *"   # 09:18 IST slot → window 09:03–09:33
    - cron: "15 8 * * *"   # 14:00 IST slot → window 13:45–14:15
  workflow_dispatch:

concurrency:
  group: naukri-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Random delay within ±15 min of the slot
        if: github.event_name == 'schedule'
        env:
          SLOT_CRON: ${{ github.event.schedule }}
        run: |
          read -r m h _ <<< "$SLOT_CRON"
          slot=$(( (10#$h * 60 + 10#$m + 15) * 60 ))
          offset=$(( RANDOM % 1801 - 900 ))
          now=$(( 10#$(date -u +%H) * 3600 + 10#$(date -u +%M) * 60 + 10#$(date -u +%S) ))
          wait=$(( slot + offset - now ))
          (( wait < 0 )) && wait=0
          msg="Slot $(date -u -d @$(( slot + 19800 )) +%H:%M) IST, offset ${offset}s → update planned at $(date -u -d @$(( now + wait + 19800 )) +%H:%M:%S) IST (waiting ${wait}s)"
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          sleep "$wait"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Decrypt session and resumes
        env:
          CI_SECRETS_PASSPHRASE: ${{ secrets.CI_SECRETS_PASSPHRASE }}
        run: node ci/crypto.js decrypt

      - name: Refresh profile
        env:
          NAUKRI_STORAGE_STATE: ci-secrets/naukri-session.json
          RESUME_A_PATH: ci-secrets/resume-a.pdf
          RESUME_B_PATH: ci-secrets/resume-b.pdf
        run: |
          export RESUME_LABEL=$([ $(( GITHUB_RUN_NUMBER % 2 )) -eq 0 ] && echo A || echo B)
          xvfb-run -a node naukri-profile-refresh.js

      - name: Run summary
        if: always()
        run: |
          {
            echo "### Naukri refresh — ${{ job.status }} — $(TZ=Asia/Kolkata date '+%d %b %Y, %H:%M IST')"
            echo '```'
            cat naukri-refresh.log 2>/dev/null || echo "no log — failed before the refresh script ran (see step logs)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Screenshots show the profile page, and artifacts on a public repo are downloadable by anyone,
      # so they are encrypted with the same passphrase before upload.
      - name: Encrypt failure screenshots
        if: failure()
        env:
          CI_SECRETS_PASSPHRASE: ${{ secrets.CI_SECRETS_PASSPHRASE }}
        run: node ci/crypto.js encrypt naukri-refresh-error-*.png

      - name: Upload log and encrypted screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-refresh-debug
          path: |
            naukri-refresh.log
            naukri-refresh-error-*.png.enc
          if-no-files-found: ignore
          retention-days: 7
